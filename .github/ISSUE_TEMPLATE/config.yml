# 提问前请先看这些

## 1. 先查 FAQ

[README 第七章](https://github.com/nanwaynan/QQ_Summarizer#七常见问题faq) 有 40 条按症状分类的常见问题，覆盖：

- 启动闪退、单文件版慢、缺 DLL
- 服务红点、转圈不动、二维码不出、QQ 风控
- API 报错、总结太慢、图片为空
- 数据不完整警告、切换账号卡住

大部分问题在那里已经有答案。

## 2. 确认环境

| 项目 | 要求 |
|---|---|
| 操作系统 | Windows 10 / 11（64 位） |
| QQ 客户端 | 推荐 NT 9.9.25 ~ 9.9.36 |
| AI 接口 | OpenAI 兼容；要图片甄选需支持视觉 |
| 权限 | 首次启动服务需管理员（UAC） |

**不支持** macOS / Linux，不支持 32 位。

## 3. 附上必要信息

提问时请提供：

- **使用的版本**：Bat_Startup_Version / EXE_Single_File_Version / 源码
- **QQ 版本**：程序「使用帮助」页可以直接看到
- **具体报错**：日志片段（`logs\app.log`，Key 已自动打码，可放心贴）
- **复现步骤**：你是怎么操作的

只说「用不了」很难帮你定位问题。

## 4. 关于隐私

**不要在 issue 里贴以下内容**：

- API Key（哪怕已失效）
- 完整的 `config.json`（含群号、账号）
- 群聊内容截图（除非已打码）

日志文件是安全的 —— 程序会自动把 Key 打码成 `sk-a********wxyz`。

## 5. 关于响应时间

这是一个个人项目，维护者不保证响应时效。但以下是会优先处理的：

- 有完整复现步骤和环境信息的 bug
- 有明确场景的功能建议

## 6. 安全提示

如果发现的是**安全漏洞**（如任意文件读写、命令注入），请**不要**开公开 issue，直接通过 GitHub 的 [Security Advisories](https://github.com/nanwaynan/QQ_Summarizer/security/advisories/new) 私下报告。
