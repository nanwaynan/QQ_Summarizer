name: 代码检查

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  syntax-check:
    name: 语法检查 (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 显示版本
        run: |
          python --version
          echo "工作目录: ${{ github.workspace }}"

      - name: 全量语法编译
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'Source_Code_Version'
          $files = Get-ChildItem -Path $root -Filter '*.py' -Recurse
          Write-Host "找到 $($files.Count) 个 .py 文件"

          $failed = @()
          foreach ($f in $files) {
            python -m py_compile $f.FullName
            if ($LASTEXITCODE -ne 0) {
              $failed += $f.FullName
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host "::error::$($failed.Count) 个文件编译失败"
            $failed | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "全部通过"

      - name: 检查 spec 文件语法
        shell: pwsh
        run: |
          $specs = Get-ChildItem -Path 'Source_Code_Version' -Filter '*.spec'
          foreach ($s in $specs) {
            Write-Host "检查 $($s.Name)"
            python -m py_compile $s.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: 核心模块导入测试
        shell: pwsh
        run: |
          # 只验证纯 Python 模块（无 Qt 依赖的部分）
          $env:PYTHONPATH = "${{ github.workspace }}\Source_Code_Version"
          python -c @"
import sys
sys.path.insert(0, r'Source_Code_Version')
try:
    import app.config
    import app.constants
    import app.core.prompts
    import app.core.images
    print('核心模块导入成功')
except ImportError as e:
    print(f'导入失败（可能是可选依赖缺失）: {e}')
    # 不视为失败：CI 环境未安装 PySide6
"@

      - name: 敏感信息扫描
        shell: pwsh
        run: |
          # 防止有人误提交真实密钥
          $patterns = @('sk-[a-zA-Z0-9]{20,}', 'ghp_[a-zA-Z0-9]{30,}', '54fcf3')
          $found = $false
          foreach ($pat in $patterns) {
            $hits = Get-ChildItem -Path '.' -Recurse -File -Include *.py,*.json,*.md,*.bat,*.txt |
                    Where-Object { $_.FullName -notmatch '\.git\\' } |
                    Select-String -Pattern $pat -List
            if ($hits) {
              Write-Host "::error::发现疑似密钥（模式: $pat）"
              $hits | ForEach-Object { Write-Host "  $($_.Path):$($_.LineNumber)" }
              $found = $true
            }
          }
          if ($found) { exit 1 }
          Write-Host "未发现硬编码密钥"

      - name: 检查必要文件
        shell: pwsh
        run: |
          $required = @(
            'README.md',
            'LICENSE',
            '.gitignore',
            'Source_Code_Version/main.py',
            'Source_Code_Version/requirements.txt',
            'Source_Code_Version/config.example.json'
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::缺少必要文件"
            $missing | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "必要文件齐全"
