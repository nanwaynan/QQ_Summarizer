name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    name: 语法与结构检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python 版本
        run: python --version

      - name: 编译所有 .py 文件
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path Source_Code_Version -Filter *.py -Recurse
          Write-Host "找到 $($files.Count) 个 Python 文件"
          $bad = 0
          foreach ($f in $files) {
            python -m py_compile $f.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error file=$($f.FullName)::编译失败"
              $bad++
            }
          }
          if ($bad -gt 0) {
            Write-Host "::error::$bad 个文件编译失败"
            exit 1
          }
          Write-Host "全部通过"

      - name: 编译 spec 文件
        shell: pwsh
        run: |
          $specs = Get-ChildItem -Path Source_Code_Version -Filter *.spec
          foreach ($s in $specs) {
            Write-Host "检查 $($s.Name)"
            python -m py_compile $s.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Write-Host "spec 全部通过"

      - name: 检查必要文件
        shell: pwsh
        run: |
          $required = @(
            'README.md',
            'LICENSE',
            'CHANGELOG.md',
            '.gitignore',
            'Source_Code_Version/main.py',
            'Source_Code_Version/requirements.txt',
            'Source_Code_Version/config.example.json',
            'Source_Code_Version/使用说明.md'
          )
          $missing = 0
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              Write-Host "::error::缺少文件 $f"
              $missing++
            }
          }
          if ($missing -gt 0) { exit 1 }
          Write-Host "必要文件齐全"

      - name: 扫描硬编码密钥
        shell: pwsh
        run: |
          $patterns = @('sk-[a-zA-Z0-9]{20,}', 'ghp_[a-zA-Z0-9]{30,}')
          $bad = 0
          foreach ($pat in $patterns) {
            $hits = Get-ChildItem -Recurse -File -Include *.py,*.json,*.md,*.bat,*.txt,*.yml |
                    Where-Object { $_.FullName -notmatch '\\.git\\' } |
                    Select-String -Pattern $pat -List
            foreach ($h in $hits) {
              Write-Host "::error file=$($h.Path)::疑似硬编码密钥 ($pat)"
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "未发现硬编码密钥"
